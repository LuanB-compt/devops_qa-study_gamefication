name: gamification-jenkins

services:
  jenkins:
    build: ./jenkins
    image: gamification-jenkins:lts
    container_name: jenkins
    # root para acessar /var/run/docker.sock do host (ambiente de estudo)
    user: root
    restart: unless-stopped
    ports:
      - "8180:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  jenkins_home:
