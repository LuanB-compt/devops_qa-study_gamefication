version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: gamification-postgres
    hostname: postgres
    restart: always
    environment:
      POSTGRES_DB: gamificationdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gamificationdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      app_net:
        aliases:
          - postgres

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: gamification-pgadmin
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app_net

  app:
    build: .
    container_name: gamification-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gamificationdb
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"
    networks:
      - app_net

  frontend:
    build: ./frontend
    container_name: gamification-frontend
    restart: always
    depends_on:
      - app
    environment:
      VITE_API_PROXY_TARGET: http://app:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - app_net

volumes:
  postgres_data:
  pgadmin_data:
  frontend_node_modules:

networks:
  app_net:
    driver: bridge
